<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的作品站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="images/cover.png" alt="封面图" class="cover">
    <h1>我的作品站（持续更新）</h1>
    <p class="intro">这里收录我用 AI 工具做出来的小作品，每做完一个就放上来。</p>
  </header>

  <main>
    <section class="work">
      <img src="images/work-1.png" alt="作品一的预览图">
      <h2>作品一：报价计算器</h2>
      <p>输入数量和单价，自动算出总价和折扣。</p>
    </section>

    <section class="work">
      <img src="images/work-2.png" alt="作品二的预览图">
      <h2>作品二：待办清单</h2>
      <p>支持按日期筛选。</p>
      <p>把每天要做的事记下来，做完打勾。</p>
    </section>
    <section class="work">
      <img src="images/work-3.png" alt="作品三的预览图">
      <h2>作品三：记账小本</h2>
      <p>随手记一笔的小工具。</p>
    </section>
  </main>

  <footer>
    <p>联系方式：example@example.com</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
